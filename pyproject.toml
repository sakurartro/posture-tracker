[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "posture-tracker"
version = "0.1.0"
description = "Real-time posture tracker CLI using MediaPipe Pose, OpenCV and Rich"
requires-python = ">=3.10"
dependencies = [
    # opencv-contrib-python comes in transitively via mediapipe and provides
    # the full cv2 API; adding opencv-python here would install a second,
    # conflicting "cv2" package.
    "mediapipe==0.10.35",
    "rich>=13.7",
]

[project.scripts]
posture-tracker = "posture_tracker.main:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
